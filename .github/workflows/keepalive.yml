# Once a day: a small call to the server (the same one the sign-in page makes, no password, no data).
# It keeps the free Supabase project from being paused in quiet weeks (it also serves the WMS app),
# and if the server does not answer the run fails and GitHub emails the account owner.
name: keep-alive

on:
  schedule:
    - cron: '17 4 * * *'   # every day at 04:17 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/keepalive.yml']

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ask the server if it is up
        run: |
          code=$(curl -s -o out.json -w '%{http_code}' --max-time 30 -X POST \
            "https://iwatwpcemndhjysghzil.supabase.co/rest/v1/rpc/svr_status" \
            -H "apikey: sb_publishable_4boIKxcwLdps6bgEtCDMAw_IcK7Ekev" \
            -H "Content-Type: application/json" -d '{}')
          echo "HTTP $code: $(cat out.json)"
          test "$code" = "200"
