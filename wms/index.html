<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#111a2e">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="מחסן">
<title>ניהול מחסן</title>
<style>
  :root {
    --bg: #f2f4f8; --card: #fff; --ink: #18202f; --mut: #647084; --line: #e2e6ed;
    --acc: #1d63d8; --acc-d: #174fb0; --acc-l: #e8f0fd; --nav: #111a2e;
    --green: #0f7a55; --green-l: #e1f5ec; --amber: #a85d00; --amber-l: #fdf0d9;
    --red: #bf3229; --red-l: #fde8e6; --gray-l: #eceff4;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: "Segoe UI", Arial, sans-serif; background: var(--bg); color: var(--ink); font-size: 15px; line-height: 1.45; }
  a { color: var(--acc); text-decoration: none; }
  h1 { font-size: 1.5rem; margin: 0; }
  h2 { font-size: 1.1rem; margin: 0; }
  h3 { font-size: 1rem; margin: 0 0 10px; }

  #app { display: flex; min-height: 100vh; }
  #nav { width: 224px; flex-shrink: 0; background: var(--nav); color: #c5cedd; position: sticky; top: 0; height: 100vh; overflow-y: auto; }
  .brand { padding: 16px 18px 12px; border-bottom: 1px solid #25304a; }
  .logo { font-weight: 700; letter-spacing: 2px; color: #fff; font-size: 1.15rem; }
  #wh-name { font-size: .85rem; color: #8e9bb3; margin-top: 2px; }
  #nav-links { padding: 8px 8px 20px; display: flex; flex-direction: column; gap: 1px; }
  #nav-links a { display: flex; justify-content: space-between; align-items: center; padding: 7px 12px; border-radius: 7px; color: #c5cedd; }
  #nav-links a:hover { background: #1c2740; }
  #nav-links a.on { background: var(--acc); color: #fff; }
  #nav-links .cnt { background: #fff; color: var(--nav); border-radius: 10px; font-size: .72rem; font-weight: 700; padding: 1px 7px; }
  #nav-links .grp { font-size: .74rem; font-weight: 700; color: #7483a0; padding: 12px 12px 3px; letter-spacing: .5px; }

  #content { flex: 1; min-width: 0; }
  #topbar { background: var(--card); border-bottom: 1px solid var(--line); padding: 10px 24px; display: flex; gap: 12px; align-items: center; position: sticky; top: 0; z-index: 5; }
  #quick { flex: 1; max-width: 480px; }
  #user-chip { color: var(--mut); font-size: .85rem; margin-inline-start: auto; }
  #main { padding: 22px 24px 60px; max-width: 1320px; }

  .head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
  .sub { color: var(--mut); margin-top: 3px; font-size: .92rem; }
  .btns { display: flex; gap: 8px; flex-wrap: wrap; }
  .toolbar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 12px; }
  .toolbar input[type=search] { flex: 1; min-width: 200px; max-width: 420px; }
  .back { display: inline-block; margin-bottom: 10px; font-size: .9rem; }

  button { font: inherit; padding: 8px 14px; border-radius: 7px; border: 1px solid var(--line); background: var(--card); color: var(--ink); cursor: pointer; white-space: nowrap; }
  button:hover { background: var(--gray-l); }
  button.primary { background: var(--acc); border-color: var(--acc); color: #fff; font-weight: 600; }
  button.primary:hover { background: var(--acc-d); }
  button.danger { color: var(--red); border-color: #efc4c0; }
  button.danger:hover { background: var(--red-l); }
  button.sm { padding: 4px 10px; font-size: .85rem; }
  button.x { border: 0; background: transparent; font-size: 1.3rem; line-height: 1; padding: 2px 8px; color: var(--mut); }
  button.x:hover { color: var(--red); background: var(--red-l); }

  input, select, textarea { font: inherit; padding: 8px 10px; border: 1px solid #cfd5df; border-radius: 7px; background: #fff; color: var(--ink); max-width: 100%; }
  input:focus, select:focus, textarea:focus { outline: 2px solid var(--acc-l); border-color: var(--acc); }
  input.qty { width: 96px; text-align: center; }
  textarea { width: 100%; min-height: 150px; direction: ltr; text-align: right; font-family: Consolas, monospace; font-size: .88rem; }
  label.chk { display: inline-flex; gap: 6px; align-items: center; cursor: pointer; }

  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 16px; margin-bottom: 16px; }
  .tw { background: var(--card); border: 1px solid var(--line); border-radius: 10px; overflow-x: auto; margin-bottom: 14px; }
  table { border-collapse: collapse; width: 100%; }
  th { text-align: start; font-size: .8rem; color: var(--mut); font-weight: 600; padding: 9px 12px; background: #f8f9fb; border-bottom: 1px solid var(--line); white-space: nowrap; }
  td { padding: 9px 12px; border-bottom: 1px solid #eef0f4; vertical-align: middle; }
  tr:last-child td { border-bottom: 0; }
  tr.click { cursor: pointer; }
  tr.click:hover td { background: #f6f9ff; }
  tr.done td { color: var(--mut); background: #fafbfc; }
  tr.hl td { background: #fff7d6; }
  td.n, th.n { text-align: center; font-variant-numeric: tabular-nums; }
  td.code { font-family: Consolas, monospace; direction: ltr; text-align: right; white-space: nowrap; }
  td.act { white-space: nowrap; text-align: end; }
  .empty { background: var(--card); border: 1px dashed #cdd3de; border-radius: 10px; padding: 34px 16px; text-align: center; color: var(--mut); margin-bottom: 14px; }
  .pos { color: var(--green); font-weight: 600; } .neg { color: var(--red); font-weight: 600; }
  .mut { color: var(--mut); }
  .hint { font-size: .8rem; color: var(--mut); min-height: 1.1em; margin-top: 2px; }
  .hint.bad { color: var(--red); }

  .badge { display: inline-block; padding: 2px 9px; border-radius: 20px; font-size: .78rem; font-weight: 600; white-space: nowrap; }
  .b-blue { background: var(--acc-l); color: var(--acc-d); } .b-green { background: var(--green-l); color: var(--green); }
  .b-amber { background: var(--amber-l); color: var(--amber); } .b-red { background: var(--red-l); color: var(--red); }
  .b-gray { background: var(--gray-l); color: var(--mut); }

  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 18px; }
  .tile { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; color: var(--ink); display: block; }
  a.tile:hover { border-color: var(--acc); }
  .tile .tv { font-size: 1.7rem; font-weight: 700; line-height: 1.2; }
  .tile .tl { color: var(--mut); font-size: .88rem; }
  .tile.warn .tv { color: var(--red); }
  .cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(330px, 1fr)); gap: 16px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; margin-bottom: 14px; }
  .fld { display: flex; flex-direction: column; gap: 4px; }
  .fld > span { font-size: .82rem; color: var(--mut); font-weight: 600; }
  .fld input, .fld select { width: 100%; }
  table.lines td { vertical-align: top; }
  table.lines input:not(.qty), table.lines select { width: 100%; min-width: 130px; }
  ol.steps { margin: 8px 0 16px; padding-inline-start: 20px; } ol.steps li { margin-bottom: 4px; }

  .overlay { position: fixed; inset: 0; background: rgba(15, 22, 40, .5); display: flex; align-items: flex-start; justify-content: center; padding: 4vh 12px; z-index: 50; }
  .modal { background: var(--card); border-radius: 12px; width: 100%; max-width: 900px; max-height: 92vh; display: flex; flex-direction: column; box-shadow: 0 20px 60px rgba(0,0,0,.3); }
  .mh { display: flex; justify-content: space-between; align-items: center; padding: 14px 18px; border-bottom: 1px solid var(--line); }
  .mb { padding: 18px; overflow-y: auto; }
  .mf { padding: 12px 18px; border-top: 1px solid var(--line); display: flex; gap: 8px; flex-wrap: wrap; }
  #toast { position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%); background: #18202f; color: #fff; padding: 11px 20px; border-radius: 8px; z-index: 99; opacity: 0; pointer-events: none; transition: opacity .2s; max-width: 90vw; }
  #toast.show { opacity: 1; } #toast.err { background: var(--red); }

  [hidden] { display: none !important; }
  #sync { font-size: .82rem; color: var(--mut); white-space: nowrap; } #sync.bad { color: var(--red); font-weight: 600; }
  #auth { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 16px; background: var(--nav); }
  .auth-card { background: var(--card); border-radius: 14px; padding: 26px; width: 100%; max-width: 380px; display: flex; flex-direction: column; gap: 12px; }
  .auth-card .logo { color: var(--nav); } .auth-card form { display: flex; flex-direction: column; gap: 12px; }

  #menu-btn, #nav-back, .nav-foot { display: none; }
  /* טלפון: התפריט נפתח מהצד, חלונות במסך מלא, שדות וכפתורים גדולים למגע */
  @media (max-width: 820px) {
    body { font-size: 16px; }
    #app { display: block; }
    #nav { position: fixed; top: 0; bottom: 0; right: 0; width: 280px; max-width: 84vw; height: auto; z-index: 40; transform: translateX(105%); transition: transform .2s; display: flex; flex-direction: column; }
    body.nav-open #nav { transform: none; }
    body.nav-open #nav-back { display: block; position: fixed; inset: 0; background: rgba(10, 16, 30, .5); z-index: 39; }
    #nav-links { flex: 1; overflow-y: auto; } #nav-links a { padding: 11px 12px; }
    .nav-foot { display: flex; flex-direction: column; gap: 8px; padding: 12px; border-top: 1px solid #25304a; color: #8e9bb3; font-size: .85rem; }
    .nav-foot button { background: #1c2740; border-color: #2c3957; color: #dfe5ef; }
    #menu-btn { display: inline-flex; font-size: 1.4rem; line-height: 1; padding: 6px 12px; }
    #topbar { padding: 8px 10px; gap: 8px; } #topbar .top-only, #user-chip { display: none; }
    #quick { min-width: 0; } #sync { font-size: .75rem; white-space: normal; max-width: 90px; }
    #main { padding: 14px 10px 70px; }
    h1 { font-size: 1.3rem; }
    input, select, textarea { font-size: 16px; padding: 10px; }
    button { padding: 10px 14px; } button.sm { padding: 8px 12px; font-size: .9rem; }
    .head .btns { width: 100%; } .head .btns button { flex: 1 1 auto; }
    .toolbar input[type=search] { max-width: none; flex-basis: 100%; }
    .tiles { grid-template-columns: 1fr 1fr; gap: 8px; } .tile { padding: 10px 12px; } .tile .tv { font-size: 1.4rem; }
    .cols { grid-template-columns: 1fr; }
    th, td { padding: 8px 8px; font-size: .9rem; }
    input.qty { width: 84px; }
    .overlay { padding: 0; } .modal { max-width: none; height: 100%; max-height: 100%; border-radius: 0; }
    .mb { padding: 14px; flex: 1; } .mf button { flex: 1 1 auto; }
    /* שורות של תעודה מוצגות ככרטיסים במקום טבלה רחבה */
    table.lines, table.lines tbody { display: block; } table.lines thead { display: none; }
    table.lines tr { display: flex; flex-wrap: wrap; gap: 8px; padding: 10px; border-bottom: 1px solid var(--line); align-items: flex-start; }
    table.lines td { display: block; padding: 0; border: 0; flex: 1 1 140px; min-width: 0; }
    table.lines td:first-child { flex-basis: 100%; } table.lines td:last-child { flex: 0 0 auto; }
    table.lines input:not(.qty), table.lines select { min-width: 0; } table.lines input.qty { width: 100%; }
    #toast { bottom: 14px; width: max-content; }
  }
  @media print {
    .no-print, #nav, #topbar, #modal-root, #toast { display: none !important; }
    body { background: #fff; } #main { padding: 0; max-width: none; }
    .tw, .card { border-color: #999; } input, select { border: 1px solid #999; }
  }
</style>
</head>
<body>
<div id="auth" hidden>
  <div class="auth-card">
    <div class="logo">WMS</div>
    <h2 id="auth-title"></h2>
    <div id="auth-sub" class="sub"></div>
    <form id="auth-form">
      <label class="fld"><span>שם משתמש</span><input id="au-user" autocomplete="username"></label>
      <label class="fld" id="au-name-row"><span>שם מלא</span><input id="au-name" autocomplete="name"></label>
      <label class="fld"><span>סיסמה</span><input id="au-pass" type="password" autocomplete="current-password"></label>
      <div id="auth-err" class="hint bad"></div>
      <button class="primary" type="submit" id="auth-btn"></button>
    </form>
  </div>
</div>
<div id="app" hidden>
  <aside id="nav">
    <div class="brand"><div class="logo">WMS</div><div id="wh-name"></div></div>
    <nav id="nav-links"></nav>
    <div class="nav-foot"><span id="nav-user"></span><button data-act="changePass">החלפת סיסמה</button><button data-act="logout">יציאה</button></div>
  </aside>
  <div id="nav-back" data-act="toggleNav"></div>
  <div id="content">
    <div id="topbar">
      <button id="menu-btn" data-act="toggleNav" aria-label="תפריט">☰</button>
      <input id="quick" type="search" data-enter="quickFind" placeholder="איתור: מק״ט / ברקוד / איתור" autocomplete="off">
      <span id="user-chip"></span>
      <span id="sync"></span>
      <button class="sm top-only" data-act="changePass">החלפת סיסמה</button>
      <button class="sm top-only" data-act="logout">יציאה</button>
    </div>
    <main id="main"></main>
  </div>
</div>
<div id="modal-root"></div>
<div id="toast"></div>
<datalist id="dl-items"></datalist>
<datalist id="dl-locs"></datalist>
<input type="file" id="imp-file" accept="application/json,.json" hidden>

<script>
'use strict';
/* ================= עזרים ================= */
const KEY = 'wms-data-v1';
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
let _uid = 0;
const uid = () => Date.now().toString(36) + (++_uid).toString(36) + Math.random().toString(36).slice(2, 7);
const n = v => { const x = parseFloat(v); return isFinite(x) ? x : 0; };
const r3 = x => Math.round(x * 1000) / 1000;
const num = v => r3(n(v)).toLocaleString('he-IL', { maximumFractionDigits: 3 });
const sum = (arr, f) => arr.reduce((a, x) => a + n(f(x)), 0);
const today = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };
const fmtDate = s => s ? String(s).split('-').reverse().join('/') : '';
const fmtTs = ts => new Date(ts).toLocaleString('he-IL', { dateStyle: 'short', timeStyle: 'short' });
const cmp = (a, b) => String(a).localeCompare(String(b), 'he', { numeric: true });

const LOC_TYPES = { pick: 'ליקוט', storage: 'אחסון', receiving: 'קבלה', returns: 'החזרות', damaged: 'פסולים' };
const PICKABLE = ['pick', 'storage'];
/* סוגי תנועות מלאי, לפי סוגי התעודות */
const MV = { open: 'יתרת פתיחה', grv: 'קבלה מספק', ship: 'משלוח ללקוח', tr: 'העברה בין מחסנים', cret: 'החזרה מלקוח', sret: 'החזרה לספק', count: 'ספירת מלאי', adj: 'תיקון יתרה' };
const ST = {
  receipt: { open: ['טיוטא', 'b-blue'], partial: ['התקבלה חלקית', 'b-amber'], done: ['סופית', 'b-green'], closed: ['סופית (בחוסר)', 'b-gray'] },
  order: { new: ['טיוטא', 'b-gray'], picking: ['בליקוט', 'b-blue'], picked: ['לוקטה', 'b-amber'], shipped: ['סופקה', 'b-green'], cancelled: ['מבוטלת', 'b-red'] },
  ship: { draft: ['טיוטא', 'b-blue'], final: ['סופית', 'b-green'], cancelled: ['מבוטלת', 'b-red'] }
};
const badge = (kind, s) => { const [t, c] = ST[kind][s] || [s, 'b-gray']; return `<span class="badge ${c}">${t}</span>`; };
const FINAL = '<span class="badge b-green">סופית</span>';
const URGENT = '<span class="badge b-red">דחוף</span>';

function toast(msg, err) {
  const t = $('#toast'); t.textContent = msg; t.className = 'show' + (err ? ' err' : '');
  clearTimeout(toast.t); toast.t = setTimeout(() => t.className = '', err ? 4500 : 2600);
}
const fail = msg => { toast(msg, true); return null; };
function download(name, content, mime) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([content], { type: mime }));
  a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}
const csv = rows => '﻿' + rows.map(r => r.map(c => '"' + String(c == null ? '' : c).replace(/"/g, '""') + '"').join(',')).join('\r\n');

/* ================= נתונים ================= */
function emptyDb() {
  return { v: 2, items: [], locations: [], warhs: {}, customers: [], suppliers: [], stock: {}, receipts: [], orders: [], shipments: [], transfers: [], returns: [], counts: [], moves: [], seq: {}, settings: { name: 'החברה שלי', user: '' } };
}
let db = emptyDb();
let _idx = null;
/* שמירה = שליחת השינויים לשרת. הפעולות נשלחות אחת אחרי השנייה, לפי הסדר */
function save() { _idx = null; if (me) chain = chain.then(push); }
function idx() {
  if (!_idx) _idx = { items: new Map(db.items.map(i => [i.id, i])), locs: new Map(db.locations.map(l => [l.id, l])) };
  return _idx;
}
const item = id => idx().items.get(id);
const loc = id => idx().locs.get(id);
/* מבנה איתור: מחסן.טור.ברזל.גובה.מיקום — לדוגמה 1.01.01.20.1. גבהים 10/20 לליקוט, 30/40 לאחסנה במשטחים */
const PICK_LEVELS = [10, 20], STORE_LEVELS = [30, 40];
function parseLoc(code) {
  const m = /^([^.\s\/]+)\.(\d+)\.(\d+)\.(\d+)\.(\d+)$/.exec(String(code || '').trim()); if (!m) return null;
  return { warhs: m[1], aisle: m[2], bay: m[3], level: m[4], pos: m[5], type: PICK_LEVELS.includes(+m[4]) ? 'pick' : STORE_LEVELS.includes(+m[4]) ? 'storage' : '' };
}
/* איתור שכולל את קוד המחסן מוצג כמו שהוא; אחרת מחסן/איתור */
const locLabel = l => l.code.startsWith(l.warhs + '.') ? l.code : l.warhs + '/' + l.code;
const locCode = id => { const l = loc(id); return l ? locLabel(l) : '?'; };
const locTd = id => { const l = loc(id); return `<td class="code">${esc(l ? l.warhs : '?')}</td><td class="code">${esc(l ? l.code : '?')}</td>`; };
const sortedLocs = () => db.locations.slice().sort((a, b) => cmp(a.warhs, b.warhs) || cmp(a.code, b.code));
/* מספור תעודות: קידומת + שנה + מספר רץ */
function nextNum(prefix) { db.seq[prefix] = (db.seq[prefix] || 0) + 1; return prefix + String(new Date().getFullYear()).slice(2) + String(db.seq[prefix]).padStart(6, '0'); }

const sk = (itemId, locId) => itemId + '|' + locId;
const qtyAt = (itemId, locId) => db.stock[sk(itemId, locId)] || 0;
function addStock(itemId, locId, delta, type, doc, note) {
  const k = sk(itemId, locId), q = r3((db.stock[k] || 0) + delta);
  if (q === 0) delete db.stock[k]; else db.stock[k] = q;
  db.moves.push({ id: uid(), ts: Date.now(), type, itemId, locId, qty: r3(delta), doc: doc || '', note: note || '', user: me ? me.name || me.username : '' });
}
const stockRows = () => Object.keys(db.stock).map(k => { const [itemId, locId] = k.split('|'); return { itemId, locId, qty: db.stock[k] }; });
/* כמויות שמשוריינות להזמנות לקוח שנמצאות בליקוט */
function reservedMap() {
  const m = {};
  for (const o of db.orders) if (o.status === 'picking')
    for (const ln of o.lines) for (const a of ln.allocs || []) if (!a.done) { const k = sk(ln.itemId, a.locId); m[k] = r3((m[k] || 0) + a.qty); }
  return m;
}
/* סיכום לפי פריט: יתרה, משוריין, זמין לליקוט */
function summary() {
  const res = reservedMap(), m = new Map();
  for (const k in db.stock) {
    const [iid, lid] = k.split('|'), q = db.stock[k], l = loc(lid);
    const s = m.get(iid) || { total: 0, avail: 0, reserved: 0, locs: [] };
    const rs = res[k] || 0;
    s.total = r3(s.total + q); s.reserved = r3(s.reserved + rs);
    if (l && PICKABLE.includes(l.type)) s.avail = r3(s.avail + q - rs);
    s.locs.push(locCode(lid)); m.set(iid, s);
  }
  return m;
}
function resolveItem(text) {
  const t = String(text || '').trim().toLowerCase(); if (!t) return null;
  return db.items.find(i => i.sku.toLowerCase() === t) || db.items.find(i => i.barcode && i.barcode.toLowerCase() === t) || db.items.find(i => i.name.toLowerCase() === t) || null;
}

/* בדיקת שורות תעודה: מחזיר רק שורות מלאות, או null אם יש שגיאה */
function cleanLines(lines, qtyKey = 'qty') {
  const used = lines.filter(l => String(l.itemText || '').trim() || l.itemId);
  if (!used.length) return fail('יש להוסיף לפחות שורה אחת עם פריט');
  for (let i = 0; i < used.length; i++) {
    if (!used[i].itemId || !item(used[i].itemId)) return fail(`שורה ${i + 1}: המק״ט לא נמצא בטבלת הפריטים`);
    if (!(n(used[i][qtyKey]) > 0)) return fail(`שורה ${i + 1}: יש להזין כמות גדולה מאפס`);
  }
  return used;
}

/* בונה את רשימת האיתורים ליצירה: מחסן.טור.ברזל.גובה.מיקום */
function bulkPlan(d) {
  const warhs = String(d.warhs).trim(), a1 = Math.floor(n(d.aisleFrom)), a2 = Math.floor(n(d.aisleTo)), bays = Math.floor(n(d.bays)), pos = Math.floor(n(d.positions));
  const lv = s => [...new Set(String(s).split(/[,\s]+/).filter(x => /^\d+$/.test(x)))];
  const levels = lv(d.pickLevels).map(x => [x, 'pick']).concat(lv(d.storeLevels).filter(x => !lv(d.pickLevels).includes(x)).map(x => [x, 'storage']));
  if (!warhs || /[.\/\s]/.test(warhs)) return { err: 'קוד המחסן חסר או מכיל נקודה, רווח או /' };
  if (a1 < 1 || a2 < a1) return { err: 'טווח הטורים לא תקין' };
  if (bays < 1 || pos < 1 || !levels.length) return { err: 'יש למלא ברזלים, גבהים ומיקומים' };
  if ((a2 - a1 + 1) * bays * levels.length * pos > 10000) return { err: 'יותר מדי איתורים בפעולה אחת (מקסימום 10,000)' };
  const p2 = x => String(x).padStart(2, '0'), out = [];
  for (let a = a1; a <= a2; a++) for (let b = 1; b <= bays; b++) for (const [l, type] of levels) for (let p = 1; p <= pos; p++) out.push([`${warhs}.${p2(a)}.${p2(b)}.${l}.${p}`, type]);
  return { warhs, list: out };
}

    table = cust ? tbl(['מק״ט', 'תאור פריט', '#כמות', 'מצב', 'מחסן', 'איתור', 'סיבה'], d.lines.map(l => `<tr>${itemTd(l.itemId)}<td class="n">${num(l.qty)}</td><td>${CONDS[l.cond] || ''}</td>${locTd(l.locId)}<td>${esc(l.reason)}</td></tr>`))
      : tbl(['מק״ט', 'תאור פריט', '#כמות', 'מחסן', 'איתור', 'סיבה'], d.lines.map(l => `<tr>${itemTd(l.itemId)}<td class="n">${num(l.qty)}</td>${locTd(l.fromLoc)}<td>${esc(l.reason)}</td></tr>`));
  } else { title = `ספירת מלאי ${d.num}`; meta = `מחסן/איתור: ${esc(locCode(d.locId))} · ${fmtDate(d.date)}`;
    table = tbl(['מק״ט', 'תאור פריט', '#יתרה במערכת', '#נספר', '#הפרש'], d.lines.map(l => { const df = r3(l.counted - l.system); return `<tr>${itemTd(l.itemId)}<td class="n">${num(l.system)}</td><td class="n">${num(l.counted)}</td><td class="n ${df > 0 ? 'pos' : df < 0 ? 'neg' : ''}" dir="ltr">${df > 0 ? '+' : ''}${num(df)}</td></tr>`; })); }
  showModal(() => frame(title, `<p class="mut">${FINAL} · ${meta}${d.notes ? ' · ' + esc(d.notes) : ''}</p>${table}`, '', 'סגור'));
};

/* ================= תנועות מלאי ================= */
views.moves = () => pageHead('תנועות מלאי', `<button data-act="movesCsv">ייצוא לאקסל</button>`, 'כרטסת מלאי: כל כניסה, יציאה והעברה, עם התעודה שיצרה אותה') +
  searchBar('mv', 'חיפוש לפי פריט, מחסן, איתור, תעודה או פרטים', `<select data-filter="mvType"><option value="">כל סוגי התנועות</option>${[...new Set(db.moves.map(m => m.type))].map(t => `<option ${ui.f.mvType === t ? 'selected' : ''}>${esc(t)}</option>`).join('')}</select>
    <label class="chk">מתאריך <input type="date" data-filter="mvFrom" value="${esc(ui.f.mvFrom || '')}"></label><label class="chk">עד <input type="date" data-filter="mvTo" value="${esc(ui.f.mvTo || '')}"></label>`) + `<div id="list">${lists.moves()}</div>`;
function filteredMoves() {
  const q = fq('mv'), from = ui.f.mvFrom ? new Date(ui.f.mvFrom + 'T00:00:00').getTime() : 0, to = ui.f.mvTo ? new Date(ui.f.mvTo + 'T23:59:59').getTime() : Infinity;
  return db.moves.filter(m => { if (ui.f.mvType && m.type !== ui.f.mvType) return false; if (m.ts < from || m.ts > to) return false; if (!q) return true;
    const it = item(m.itemId) || {}; return [it.sku, it.name, it.barcode, locCode(m.locId), m.doc, m.note, m.type].join(' ').toLowerCase().includes(q); }).reverse();
}
lists.moves = () => { const all = filteredMoves();
  return tbl(MOVE_HEADS, all.slice(0, 500).map(moveRow), 'אין תנועות להצגה') + (all.length > 500 ? `<p class="mut">מוצגות 500 התנועות האחרונות מתוך ${num(all.length)}. הייצוא לאקסל כולל את כולן.</p>` : ''); };
actions.movesCsv = () => {
  const rows = [['תאריך', 'סוג תנועה', 'מק״ט', 'תאור פריט', 'מחסן', 'איתור', 'כמות', 'תעודה', 'פרטים', 'משתמש']];
  filteredMoves().forEach(m => { const it = item(m.itemId) || {}, l = loc(m.locId) || {}; rows.push([fmtTs(m.ts), m.type, it.sku, it.name, l.warhs, l.code, m.qty, m.doc, m.note, m.user]); });
  download(`תנועות-מלאי-${today()}.csv`, csv(rows), 'text/csv;charset=utf-8');
};

/* ================= הגדרות וגיבוי ================= */
views.settings = () => pageHead('הגדרות וגיבוי') + `
  <div class="card"><h3>פרטי החברה</h3><div class="grid"><label class="fld"><span>שם החברה</span><input data-set="name" value="${esc(db.settings.name)}" ${me.role === 'admin' ? '' : 'disabled'}></label><label class="fld"><span>מחובר כעת</span><input disabled value="${esc(me.username)} · ${ROLES[me.role]}"></label></div></div>
  <div class="card"><h3>גיבוי ושחזור</h3><p class="sub" style="margin-bottom:12px">הנתונים נשמרים בענן ומשותפים לכל המשתמשים. מומלץ שמנהל יוריד קובץ גיבוי מדי פעם. שחזור מגיבוי מחליף את הנתונים אצל כולם. הפעולות בעמוד הזה מותרות למנהל בלבד.</p>
    <div class="btns"><button class="primary" data-act="exportBackup">הורד קובץ גיבוי</button><button data-act="pickImport">שחזר מקובץ גיבוי</button></div></div>
  <div class="card"><h3>ייבוא נתונים מאקסל</h3><div class="btns"><button data-act="importItems">ייבוא פריטים</button><button data-act="importStock">ייבוא יתרות פתיחה</button></div></div>
  <div class="card"><h3>נתוני דוגמה ואיפוס</h3><div class="btns"><button data-act="loadDemo">טען נתוני דוגמה</button><button class="danger" data-act="wipe">מחק את כל הנתונים</button></div></div>
  <p class="mut">סה״כ במערכת: ${num(db.items.length)} פריטים · ${num(Object.keys(db.warhs).length)} מחסנים · ${num(db.locations.length)} איתורים · ${num(db.moves.length)} תנועות מלאי</p>`;
actions.exportBackup = () => download(`גיבוי-מחסן-${today()}.json`, JSON.stringify(db), 'application/json');
actions.pickImport = () => $('#imp-file').click();
actions.importStock = () => {
  ui.draft = { text: '' };
  showModal(() => frame('ייבוא יתרות פתיחה', `<p class="sub">הדביקו שורות מאקסל בסדר: <b>מק״ט, איתור, יתרה</b>. היתרה שתוזן תקבע את המלאי באיתור (לא תתווסף לקיים). איתור חדש במבנה <span dir="ltr">1.01.01.20.1</span> ייפתח אוטומטית עם המחסן והסוג המתאימים; מק״ט שלא קיים בטבלת הפריטים ידולג.</p><textarea id="d-text" data-d="text" placeholder="1001	1.01.01.10.1	120"></textarea>`, `<button class="primary" data-act="doImportStock">ייבא</button>`));
};
actions.doImportStock = () => {
  let ok = 0, skip = 0;
  for (const c of splitRows(ui.draft.text)) {
    /* שלוש עמודות: מק״ט, איתור, יתרה. ארבע עמודות: מק״ט, מחסן, איתור, יתרה */
    const it = resolveItem(c[0]), four = c.length >= 4, q = four ? c[3] : c[2];
    let l = four ? findLoc(c[1], c[2] || '0') : locByCode(c[1]);
    const code = four ? (c[2] || '0') : (c[1] || ''), p = parseLoc(code), w = four ? c[1] : (p ? p.warhs : '');
    if (!it || (!l && (!w || !code || w.includes('/') || code.includes('/'))) || q === undefined || q === '' || !isFinite(parseFloat(q)) || n(q) < 0) { skip++; continue; }
    if (!l) { l = { id: uid(), warhs: w, code, type: (p && p.type) || 'storage' }; db.locations.push(l); if (db.warhs[w] === undefined) db.warhs[w] = ''; _idx = null; }
    const delta = r3(n(q) - qtyAt(it.id, l.id)); if (delta !== 0) addStock(it.id, l.id, delta, MV.open, '', 'ייבוא');
    ok++;
  }
  if (!ok) return fail('לא נמצאו שורות תקינות. בדקו שהמק״טים קיימים ושהאיתורים במבנה הנכון.');
  closeModal(); commit(); toast(`יובאו ${ok} שורות יתרה${skip ? `, דולגו ${skip}` : ''}`);
};
actions.wipe = () => {
  if (!confirm('פעולה זו תמחק את כל הפריטים, המחסנים, היתרות והתעודות. להמשיך?')) return;
  if (!confirm('אין דרך לשחזר בלי קובץ גיבוי. למחוק בכל זאת?')) return;
  db = emptyDb(); commit(); toast('כל הנתונים נמחקו');
};
actions.loadDemo = () => {
  if ((db.items.length || db.locations.length) && !confirm('נתוני הדוגמה יחליפו את כל הנתונים הקיימים. להמשיך?')) return;
  db = emptyDb(); db.settings.name = 'חברת הדגמה בע״מ';
  db.warhs = { 1: 'מחסן ראשי' };
  const L = {}, I = {};
  /* מחסן 1: שני טורים, שני ברזלים בכל טור, גבהים 10-40, שלושה מיקומים בכל ברזל */
  bulkPlan({ warhs: '1', aisleFrom: 1, aisleTo: 2, bays: 2, positions: 3, pickLevels: '10,20', storeLevels: '30,40' }).list
    .concat([['קבלה', 'receiving'], ['החזרות', 'returns'], ['פסולים', 'damaged']])
    .forEach(([code, type]) => { const l = { id: uid(), warhs: '1', code, type }; db.locations.push(l); L[code] = l.id; });
  [['1001', 'ברגים 4x40 (100 יח׳)', '7290000010014', 'קופסה', 'חומרי חיבור', 20], ['1002', 'דיבלים 8 מ״מ (50 יח׳)', '7290000010021', 'קופסה', 'חומרי חיבור', 20], ['2001', 'מקדחה נטענת 18V', '7290000020013', 'יח׳', 'כלי עבודה', 5], ['2002', 'מברגה חשמלית', '7290000020020', 'יח׳', 'כלי עבודה', 5],
    ['3001', 'צבע לבן 5 ליטר', '7290000030012', 'פח', 'צבעים', 10], ['3002', 'מברשת צבע 2 אינץ׳', '7290000030029', 'יח׳', 'צבעים', 15], ['4001', 'כפפות עבודה L', '7290000040011', 'זוג', 'מיגון', 30], ['4002', 'משקפי מגן', '7290000040028', 'יח׳', 'מיגון', 10]]
    .forEach(([sku, name, barcode, unit, category, minQty]) => { const i = { id: uid(), sku, name, barcode, unit, category, minQty, active: true }; db.items.push(i); I[sku] = i.id; });
  _idx = null;
  [['1001', '1.01.01.10.1', 40], ['1001', '1.01.01.30.1', 120], ['1002', '1.01.01.10.2', 35], ['2001', '1.01.02.10.1', 8], ['2001', '1.01.02.30.1', 12], ['2002', '1.01.02.10.2', 3], ['3001', '1.01.02.20.1', 6], ['3002', '1.01.02.20.2', 40], ['4001', '1.02.01.10.1', 60], ['4001', '1.02.01.30.1', 200], ['4002', '1.02.01.40.1', 25], ['3002', 'פסולים', 2]]
    .forEach(([s, l, q]) => addStock(I[s], L[l], q, MV.open, '', 'נתוני דוגמה'));
  const sup = ensureParty('suppliers', 'ספק הדגמה בע״מ'), c1 = ensureParty('customers', 'בנייה ושיפוצים כהן'), c2 = ensureParty('customers', 'צבעי העיר');
  db.receipts.push({ id: uid(), num: nextNum('GR'), suppNum: sup.num, supplier: sup.name, ref: 'PO26000781', date: today(), notes: '', status: 'open', lines: [{ itemId: I['3001'], expected: 24, received: 0 }, { itemId: I['2002'], expected: 10, received: 0 }] });
  db.orders.push({ id: uid(), num: nextNum('SO'), custNum: c1.num, customer: c1.name, ref: '50231', date: today(), priority: 'urgent', notes: '', status: 'new', lines: [{ itemId: I['1001'], qty: 50, picked: 0, allocs: [] }, { itemId: I['2001'], qty: 2, picked: 0, allocs: [] }, { itemId: I['4001'], qty: 10, picked: 0, allocs: [] }] });
  db.orders.push({ id: uid(), num: nextNum('SO'), custNum: c2.num, customer: c2.name, ref: '50232', date: today(), priority: 'normal', notes: '', status: 'new', lines: [{ itemId: I['3001'], qty: 8, picked: 0, allocs: [] }, { itemId: I['3002'], qty: 12, picked: 0, allocs: [] }] });
  save(); go('#/dashboard'); toast('נתוני הדוגמה נטענו');
};

/* ================= משתמשים ================= */
views.users = () => { fetchUsers(); return pageHead('משתמשים', `<button class="primary" data-act="editUser">+ משתמש חדש</button>`, 'מנהל: כל הפעולות, כולל משתמשים, גיבוי ומחיקות. מחסנאי: כל פעולות המלאי והתעודות. צפייה בלבד: רואה הכול ולא משנה דבר.') + `<div id="list">${lists.users()}</div>`; };
lists.users = () => tbl(['שם משתמש', 'שם מלא', 'הרשאה', 'סטטוס', ''], (ui.users || []).map(u =>
  `<tr class="click ${u.active ? '' : 'done'}" data-act="editUser" data-id="${u.id}"><td class="code">${esc(u.username)}</td><td>${esc(u.name)}${u.id === me.id ? ' <span class="mut">(אני)</span>' : ''}</td><td>${ROLES[u.role]}</td><td>${u.active ? '<span class="badge b-green">פעיל</span>' : '<span class="badge b-gray">לא פעיל</span>'}</td><td class="act"><button class="sm">עריכה</button></td></tr>`), ui.users ? 'אין משתמשים' : 'טוען…');
async function fetchUsers() {
  try { ui.users = await rpc('wms_users_list', { p_token: token }); if (ui.route === 'users') refreshList(); } catch (err) { toast(errText(err), true); }
}
actions.editUser = el => {
  const u = el.dataset.id ? (ui.users || []).find(x => x.id === el.dataset.id) : null;
  ui.draft = u ? Object.assign({ password: '' }, u) : { id: '', username: '', name: '', role: 'worker', active: true, password: '' };
  showModal(() => frame(ui.draft.id ? 'עריכת משתמש' : 'משתמש חדש', `<div class="grid">${fld('שם משתמש *', 'username')}${fld('שם מלא', 'name')}${selFld('הרשאה', 'role', Object.entries(ROLES))}${fld(ui.draft.id ? 'סיסמה חדשה (ריק = בלי שינוי)' : 'סיסמה * (6 תווים לפחות)', 'password')}</div>
    ${ui.draft.id ? `<label class="chk"><input type="checkbox" data-d="active" ${ui.draft.active ? 'checked' : ''}> משתמש פעיל</label>` : ''}
    <p class="mut">מסרו למשתמש את שם המשתמש והסיסמה; הוא יכול להחליף את הסיסמה בעצמו אחרי הכניסה. משתמש לא פעיל לא יכול להיכנס.</p>`, `<button class="primary" data-act="saveUser">שמור</button>`));
};
actions.saveUser = async () => {
  const d = ui.draft;
  try {
    await rpc('wms_user_save', { p_token: token, p_id: d.id || null, p_username: d.username, p_name: d.name, p_role: d.role, p_active: d.active !== false, p_password: d.password || null });
    closeModal(); toast('המשתמש נשמר'); fetchUsers();
  } catch (err) { toast(errText(err), true); }
};
actions.changePass = () => {
  ui.draft = { old: '', pass: '', pass2: '' };
  showModal(() => frame('החלפת סיסמה', `<div class="grid">${fld('סיסמה נוכחית', 'old', { type: 'password' })}${fld('סיסמה חדשה (6 תווים לפחות)', 'pass', { type: 'password' })}${fld('סיסמה חדשה שוב', 'pass2', { type: 'password' })}</div>`, `<button class="primary" data-act="savePass">החלף סיסמה</button>`));
};
actions.savePass = async () => {
  const d = ui.draft; if (d.pass !== d.pass2) return fail('שתי הסיסמאות החדשות לא זהות');
  try { await rpc('wms_change_password', { p_token: token, p_old: d.old, p_new: d.pass }); closeModal(); toast('הסיסמה הוחלפה'); } catch (err) { toast(errText(err), true); }
};
actions.logout = async () => { const t = token; logoutLocal(); try { await rpc('wms_logout', { p_token: t }); } catch (e) { /* החיבור המקומי כבר נוקה */ } };

/* ================= אירועים ================= */
actions.toggleNav = () => document.body.classList.toggle('nav-open');
const VIEW_ACTS = new Set(['toggleNav', 'go','itemCard', 'locCard', 'viewDoc', 'closeModal', 'print', 'invCsv', 'movesCsv', 'logout', 'changePass', 'savePass']);
const ADMIN_ACTS = new Set(['wipe', 'loadDemo', 'pickImport', 'exportBackup', 'editUser', 'saveUser']);
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el || !me) return;
  const act = el.dataset.act, fn = actions[act]; if (!fn) return;
  e.preventDefault();
  if (me.role === 'viewer' && !VIEW_ACTS.has(act)) return fail('למשתמש צפייה אין הרשאה לבצע פעולות');
  if (ADMIN_ACTS.has(act) && me.role !== 'admin') return fail('הפעולה מותרת למנהל בלבד');
  fn(el, e);
});
document.addEventListener('input', e => {
  const t = e.target; if (!t.dataset) return;
  if (t.dataset.filter) { ui.f[t.dataset.filter] = t.type === 'checkbox' ? t.checked : t.value; refreshList(); }
  else if (t.dataset.d !== undefined && ui.draft) bindSet(t, false);
});
document.addEventListener('change', e => {
  const t = e.target; if (!t.dataset) return;
  if (t.id === 'imp-file') return importBackup(t);
  if (t.dataset.set) { if (me.role === 'admin') { db.settings[t.dataset.set] = t.value.trim(); commit(); } return; }
  if (t.dataset.d !== undefined && ui.draft && 'rr' in t.dataset) { bindSet(t, true); setTimeout(rerenderModal, 0); }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && ui.modal) return closeModal();
  if (e.key === 'Enter' && e.target.dataset && e.target.dataset.enter) { e.preventDefault(); actions[e.target.dataset.enter](e.target, e); }
});
function importBackup(input) {
  const file = input.files[0]; input.value = ''; if (!file) return;
  const rd = new FileReader();
  rd.onload = () => {
    try {
      const data = JSON.parse(rd.result);
      if (!data || !Array.isArray(data.items) || !Array.isArray(data.locations) || typeof data.stock !== 'object') throw new Error('bad');
      if (!confirm(`הקובץ מכיל ${data.items.length} פריטים ו-${data.locations.length} איתורים. השחזור יחליף את כל הנתונים הקיימים. להמשיך?`)) return;
      db = data; migrate(); commit(); toast('הנתונים שוחזרו מהגיבוי');
    } catch (err) { toast('הקובץ אינו קובץ גיבוי תקין של המערכת', true); }
  };
  rd.readAsText(file);
}
window.addEventListener('hashchange', () => { document.body.classList.remove('nav-open'); render(); });
$('#nav-links').addEventListener('click', () => document.body.classList.remove('nav-open'));
/* התקנה כאפליקציה: נדרש רק כשהדף מוגש מהאינטרנט */
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
boot();
